services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: prof360
      POSTGRES_PASSWORD: prof360
      POSTGRES_DB: prof360
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prof360"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  # Локальный LLM. AI-консультант работает и без него (RAG-фолбэк),
  # но для генеративных ответов выполните: docker compose exec ollama ollama pull qwen2.5:3b
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4G

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://prof360:prof360@db:5432/prof360
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      IIN_HASH_PEPPER: ${IIN_HASH_PEPPER:-dev-pepper}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      OLLAMA_BASE_URL: http://ollama:11434
      DATA_DIR: /data
      UPLOAD_DIR: /app/uploads
      DEFAULT_ADMIN_PASSWORD: Prof360!admin
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_ALLOW_EXTERNAL: ${AI_ALLOW_EXTERNAL:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      RUN_BOOTSTRAP: ${RUN_BOOTSTRAP:-1}
    volumes:
      - ./:/data:ro
      - ./backend/data/legal:/app/data/legal
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G
    command: ["./entrypoint.sh"]

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
  ollama:

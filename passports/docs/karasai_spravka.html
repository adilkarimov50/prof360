<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Справка: реальная картина · Каскелен и Иргели · 2026</title>
<link rel="stylesheet" href="assets/css/app.css?v=20260909a">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1f2e;--muted:#5c6578;--line:#dde2ea;--paper:#fafbfc;--card:#fff;
  --accent:#1b4d8c;--warn:#b33f26;--ok:#1a7a4a;--gold:#9a7b2f;
  --max:820px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Source Sans 3',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;font-size:16px}
.doc-header{background:linear-gradient(160deg,#0f1f3d 0%,#1b4d8c 100%);color:#fff;padding:56px 24px 48px}
.doc-header .inner{max-width:var(--max);margin:0 auto}
.doc-header .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;opacity:.75;margin-bottom:12px}
.doc-header h1{font-family:'Literata',Georgia,serif;font-size:clamp(1.5rem,4vw,2.1rem);font-weight:700;line-height:1.25;margin-bottom:10px}
.doc-header .sub{font-size:1.05rem;opacity:.9;margin-bottom:20px}
.doc-header .meta{display:flex;flex-wrap:wrap;gap:10px;font-size:13px}
.doc-header .meta span{background:rgba(255,255,255,.12);padding:5px 12px;border-radius:4px;border:1px solid rgba(255,255,255,.2)}
nav.toc{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:10px 24px;overflow-x:auto}
nav.toc .inner{max-width:var(--max);margin:0 auto;display:flex;gap:6px;flex-wrap:wrap}
nav.toc a{font-size:13px;color:var(--accent);text-decoration:none;padding:6px 12px;border-radius:4px;white-space:nowrap}
nav.toc a:hover{background:#eef3fa}
main{max-width:var(--max);margin:0 auto;padding:40px 24px 80px}
section{margin-bottom:48px}
section h2{font-family:'Literata',Georgia,serif;font-size:1.45rem;color:var(--accent);margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--line)}
section h3{font-size:1.1rem;margin:24px 0 12px;color:var(--ink)}
.lead{font-size:1.08rem;color:var(--muted);background:#eef3fa;border-left:4px solid var(--accent);padding:16px 20px;border-radius:0 6px 6px 0;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px 24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h3{margin-top:0;font-family:'Literata',serif;color:var(--warn);font-size:1rem}
.card .tagline{font-weight:600;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:14.5px;margin:12px 0}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f4f6f9;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
tr:last-child td{border-bottom:none}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.warn{color:var(--warn)}
ul,ol{padding-left:1.4em;margin:10px 0}
li{margin:6px 0}
.decision{background:#f8f9fb;border-left:3px solid var(--accent);padding:12px 16px;margin:10px 0;border-radius:0 4px 4px 0;font-size:15px}
.decision .ref{font-weight:700;color:var(--accent);margin-right:6px}
.note{font-size:14px;color:var(--muted);font-style:italic;margin-top:8px}
.funnel{display:flex;gap:6px;align-items:flex-end;margin:16px 0;flex-wrap:wrap}
.funnel .step{text-align:center;flex:1;min-width:90px}
.funnel .bar{background:var(--accent);color:#fff;border-radius:4px 4px 0 0;padding:10px 6px;font-weight:700;font-size:1rem}
.funnel .lbl{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.3}
.legal{border-left:3px solid var(--gold);padding:12px 16px;background:#fdfaf3;margin:10px 0;font-size:14.5px}
.recs{counter-reset:rec}
.recs li{counter-increment:rec;list-style:none;position:relative;padding-left:2em}
.recs li::before{content:counter(rec);position:absolute;left:0;font-weight:700;color:var(--accent)}
.footer-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.footer-links a{display:inline-block;padding:10px 18px;background:var(--accent);color:#fff;text-decoration:none;border-radius:6px;font-size:14px;font-weight:500}
.footer-links a.secondary{background:#fff;color:var(--accent);border:1px solid var(--line)}
@media print{nav.toc,.footer-links{display:none}.doc-header{background:#0f1f3d;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(max-width:600px){table{font-size:13px}th,td{padding:8px}}
</style>
</head>
<body data-site-page="index">
<div id="chrome-top"></div>

<header class="doc-header">
  <div class="inner">
    <div class="eyebrow">Карасайский район · Алматинская область</div>
    <h1 id="title">Аналитическая справка о сопоставлении официальных данных и фактической картины</h1>
    <p class="sub" id="subtitle"></p>
    <div class="meta" id="meta"></div>
  </div>
</header>

<nav class="toc">
  <div class="inner">
    <a href="#summary">Резюме</a>
    <a href="#kaskelen">Каскелен</a>
    <a href="#irgeli">Иргели</a>
    <a href="#gaps">Расхождения</a>
    <a href="#funnel">Профучёт</a>
    <a href="#commission">Комиссия</a>
    <a href="#legal">Правовая оценка</a>
    <a href="#recs">Предложения</a>
    <a href="#conclusion">Заключение</a>
  </div>
</nav>

<main id="content">
  <p>Загрузка…</p>
</main>

<script src="assets/js/karasai_report_ru.js?v=20260909a"></script>
<script>
(function(){
  const R = window.KARASAI_REPORT_RU;
  if (!R) { document.getElementById('content').innerHTML = '<p>Данные не найдены. Запустите scripts/build.py</p>'; return; }

  document.getElementById('subtitle').textContent = R.subtitle;
  document.getElementById('meta').innerHTML = [
    `<span>Период: ${R.period}</span>`,
    `<span>Дата: ${R.date}</span>`,
    `<span>7 месяцев 2026</span>`
  ].join('');

  const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function factsTable(facts){
    return `<table><thead><tr><th>Показатель</th><th>Значение</th><th>Комментарий</th></tr></thead><tbody>${
      facts.map(f=>`<tr><td>${esc(f.label)}</td><td class="num">${esc(f.value)}</td><td>${esc(f.note)}</td></tr>`).join('')
    }</tbody></table>`;
  }

  function funnelHtml(key, name){
    const steps = R.prevention_funnel[key];
    const max = Math.max(...steps.map(s=>s.count),1);
    return `<h3>${esc(name)}</h3><div class="funnel">${
      steps.map(s=>{
        const h = Math.max(32, s.count/max*100);
        return `<div class="step"><div class="bar" style="height:${h}px;line-height:${h}px">${s.count.toLocaleString('ru-RU')}</div><div class="lbl">${esc(s.stage)}</div></div>`;
      }).join('')
    }</div>`;
  }

  document.getElementById('content').innerHTML = `
    <section id="summary">
      <h2>Краткое резюме</h2>
      <p class="lead">${esc(R.executive_summary)}</p>
      <h3>Источники</h3>
      <ul>${R.sources.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      <h3>Нормативная база</h3>
      <ul>${R.legal_basis.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
    </section>

    <section id="kaskelen">
      <h2>${esc(R.kaskelen.name)}</h2>
      <div class="card">
        <p class="tagline warn">${esc(R.kaskelen.headline)}</p>
        ${factsTable(R.kaskelen.facts)}
      </div>
    </section>

    <section id="irgeli">
      <h2>${esc(R.irgeli.name)}</h2>
      <div class="card">
        <p class="tagline warn">${esc(R.irgeli.headline)}</p>
        ${factsTable(R.irgeli.facts)}
      </div>
    </section>

    <section id="gaps">
      <h2>Расхождения «на бумаге vs в данных»</h2>
      <table>
        <thead><tr><th>Область</th><th>В паспорте</th><th>По данным</th><th>Эффект</th></tr></thead>
        <tbody>${R.discrepancies.map(d=>`<tr><td>${esc(d.area)}</td><td class="num">${esc(d.paper)}</td><td class="num">${esc(d.data)}</td><td>${esc(d.effect)}</td></tr>`).join('')}</tbody>
      </table>
    </section>

    <section id="funnel">
      <h2>Профилактический учёт: где разрывается цепочка</h2>
      <p>Медицинский учёт → профучёт ОВД → административные материалы. Сужение воронки означает формальный характер индивидуальной профилактики.</p>
      ${funnelHtml('kaskelen','г. Каскелен')}
      ${funnelHtml('irgeli','Иргелинский сельский округ')}
    </section>

    <section id="commission">
      <h2>Комиссия при акимате района</h2>
      <p>Поручения переведены с казахского языка протоколов PDF на русский.</p>
      ${R.commission.map(sess=>`
        <div class="card">
          <h3>${esc(sess.title)}</h3>
          <p><strong>${esc(sess.date)}</strong> · ${esc(sess.place)} · Председатель: ${esc(sess.chair)}</p>
          <p><strong>Вопросы повестки:</strong></p>
          <ul>${sess.agenda.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>
          <p><strong>Принятые решения:</strong></p>
          ${sess.decisions.map(d=>`<div class="decision"><span class="ref">${esc(d.ref)}.</span>${esc(d.text)}</div>`).join('')}
          <p class="note">${esc(sess.execution_note)}</p>
        </div>
      `).join('')}
    </section>

    <section id="legal">
      <h2>Правовая оценка</h2>
      ${R.legal_findings.map(x=>`
        <div class="legal"><strong>${esc(x.issue)}</strong><br>
        ${esc(x.law)} · ${esc(x.acts)}<br>
        <em>Акт реагирования:</em> ${esc(x.reaction)}</div>
      `).join('')}
    </section>

    <section id="recs">
      <h2>Предложения прокурору района</h2>
      <ol class="recs">${R.recommendations.map(r=>`<li>${esc(r)}</li>`).join('')}</ol>
    </section>

    <section id="conclusion">
      <h2>Заключение</h2>
      <p class="lead">${esc(R.conclusion)}</p>
      <div class="footer-links">
        <a href="kaskelen_map.html">Карта Каскелена</a>
        <a href="irgeli_map.html">Карта Иргели</a>
        <a href="karasai_analysis.html" class="secondary">Дашборд расхождений</a>
        <a href="index.html" class="secondary">← На главную</a>
      </div>
    </section>
  `;
})();
</script>
<div id="chrome-bottom"></div>
<script src="assets/js/ui.js?v=20260909a"></script>
</body>
</html>
